[package]
name = "shop_wise"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
database = {path = "../database"}
map = {path = "../map"}
util = {path = "../util"}
nalgebra = "0.34.2"
ordered-float = "5.3.0"
strum = "0.28.0"
strum_macros = "0.28.0"
serde_json = "1.0.149"
serde = {version= "1.0.228", features= ["derive"] }
termsize = "0.1.9"
eframe = "0.34.2"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
bigdecimal = "0.4.10"
derive_more = { version = "2.1.1", features = ["full"] }
serial_test = "4.0.1"
itertools = "0.15.0"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Window",
    "HtmlCanvasElement",

    "Navigator",

    # Geolocation API
    "Geolocation",
    "Position",
    "Coordinates",
]

[package]
name = "shop_wise"
version = "0.1.0"
edition = "2024"

[dependencies]
database = {path = "../database"}
map = {path = "../map"}

eframe = "0.34.2"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Window",
    "HtmlCanvasElement",

    "Navigator",

    # Geolocation API
    "Geolocation",
    "Position",
    "Coordinates",
]
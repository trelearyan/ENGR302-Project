# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/rust/tags/

ensure-compiles:
  script:
    - rustc --version && cargo --version
    - cargo check

ensure-tests-pass:
  script:
    - rustc --version && cargo --version
    - cargo test --workspace --verbose

ensure-no-warnings:
  script:
    - rustc --version && cargo --version
    - export RUSTFLAGS="-D warnings"
    - cargo check

create-main-pages:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: shop_wise/dist
  # Functions that should be executed before the build script is run
  before_script:
    - apt update || true
    - yes | apt install clang || true # this returns 1 even when successful? maybe because of yes
    - rustup target add wasm32-unknown-unknown
    - cargo install --locked trunk
  script:
    - cd shop_wise
    - export TRUNK_BUILD_PUBLIC_URL="https://gitlab-web.ecs.vuw.ac.nz/shopwise-0c4d83/"
    - trunk build --release


create-test-pages:
  when: manual
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: shop_wise/dist
    path_prefix: 'mr-${CI_MERGE_REQUEST_IID}' # Results in paths like mr-123
  # Functions that should be executed before the build script is run
  before_script:
    - apt update || true
    - yes | apt install clang || true # this returns 1 even when successful? maybe because of yes
    - rustup target add wasm32-unknown-unknown
   # - cargo install --locked trunk
  script:
    - export TRUNK_BUILD_PUBLIC_URL='https://gitlab-web.ecs.vuw.ac.nz/shopwise-0c4d83/mr-${CI_MERGE_REQUEST_IID}'
    - echo $TRUNK_BUILD_PUBLIC_URL
    - echo https://gitlab-web.ecs.vuw.ac.nz/shopwise-0c4d83/mr-${CI_MERGE_REQUEST_IID}
    - echo ${CI_MERGE_REQUEST_IID}
    - cd shop_wise
    - export TRUNK_BUILD_PUBLIC_URL='https://gitlab-web.ecs.vuw.ac.nz/shopwise-0c4d83/mr-${CI_MERGE_REQUEST_IID}'
    - trunk build --release

default:
  image: "rust:latest"
  tags:
    - docker

[package]
name = "database"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[dependencies]
# `bundled` ships SQLite source inside the binary, so users don't
# need libsqlite3 installed on their machine. This also makes the
# crate WASM-portable later, per design doc section 6.3.
rusqlite = {version = "0.40.2", features = ["bundled", "serialize", "ffi-sqlite-wasm-rs"] }
serde_json = "1.0"
util = { path = "../util" }
bigdecimal = "0.4"
serde = { version = "1.0.229", features = ["derive"] }

# A small example binary so we can prove the crate works end-to-end
# without waiting for the Price Calculator. This mocks the role of
# Samuel's Price Calculator for FR-04 demonstration purposes.
[[bin]]
name = "fr04_demo"
path = "src/main.rs"